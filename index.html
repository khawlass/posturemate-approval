  <script>

      messagingSenderId: "282660135065",

    });
    const db = firebase.database();

    function setStatus(type, title, message) {
      const icons = {
        loading: `<div class="spinner"></div>`,
        success: `<svg viewBox="0 0 24 24" fill="none" stroke="#1e8e3e" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
        error:   `<svg viewBox="0 0 24 24" fill="none" stroke="#c5221f" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
        warning: `<svg viewBox="0 0 24 24" fill="none" stroke="#f29900" stroke-width="2.5"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`
      };
      document.getElementById("status-box").innerHTML =
        `<div class="status-icon ${type}">${icons[type]}</div>
         <div class="status-text"><h2>${title}</h2><p>${message}</p></div>`;
    }

    async function approveDoctor(action, uid) {
      if (!uid) {
        setStatus("error", "Link non valido", "Il link utilizzato non contiene le informazioni necessarie.");
        return;
      }

      try {
        if (action === "approve") {
          setStatus("loading", "Approvazione in corso", "Attendere prego...");
          await db.ref("v2/users/doctors/" + uid + "/approved").set(true);
          setStatus("success", "Dottore approvato", "Il medico ha ora accesso al sistema PostureMate.");
        } else if (action === "reject") {
          setStatus("error", "Richiesta rifiutata", "Il medico non potra' accedere al sistema PostureMate.");
        } else {
          setStatus("warning", "Parametro non valido", "L'azione richiesta non e' riconosciuta.");
        }
      } catch (error) {
        setStatus("error", "Errore di sistema", "Impossibile completare l'operazione: " + error.message);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      approveDoctor(params.get("action"), params.get("uid"));
    });
  </script>
