<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostureMate - Approvazione Dottore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
    }

    .card-header {
      background-color: #7CB342;
      padding: 24px 28px;
    }
    .card-header h1 {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.4px;
    }

    .card-body {
      padding: 24px 28px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .section-title .accent-bar {
      width: 4px;
      height: 24px;
      background-color: #7CB342;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .section-title span {
      font-size: 17px;
      font-weight: bold;
      color: #212121;
    }

    .info-box {
      background-color: #f1f8e9;
      border-left: 4px solid #7CB342;
      border-radius: 4px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #7CB342;
      line-height: 1.5;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #7CB342;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 8px auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-message {
      font-size: 14px;
      color: #424242;
      text-align: center;
      line-height: 1.6;
    }

    .divider {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 20px 0 16px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-outline {
      padding: 10px 22px;
      background-color: #ffffff;
      color: #7CB342;
      border: 2px solid #7CB342;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-solid {
      padding: 10px 22px;
      background-color: #7CB342;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .card-footer {
      background-color: #f4f4f4;
      border-top: 1px solid #e0e0e0;
      padding: 14px 28px;
    }
    .card-footer p {
      font-size: 11px;
      color: #9e9e9e;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="card">

  <div class="card-header">
    <h1>PostureMate</h1>
  </div>

  <div class="card-body">

    <div class="section-title">
      <div class="accent-bar"></div>
      <span id="card-title">Elaborazione in corso</span>
    </div>

    <div class="info-box" id="info-box" style="display:none;"></div>

    <div id="spinner" class="spinner"></div>
    <p class="status-message" id="status-message">Connessione al server in corso...</p>

    <hr class="divider" id="divider" style="display:none;" />

    <div class="actions" id="actions" style="display:none;">
      <a href="mailto:j.khawla@outlook.com" class="btn-outline">Contatta supporto</a>
    </div>

  </div>

  <div class="card-footer">
    <p>PostureMate &middot; Sistema di monitoraggio medico</p>
    <p>Azione eseguita dall'amministratore del sistema.</p>
  </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyDr5JZBF3i2tDV0QflxOJFGXEYXgNJkGsQ",
    authDomain:        "posturemate-6b424.firebaseapp.com",
    databaseURL:       "https://posturemate-6b424-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "posturemate-6b424",
    storageBucket:     "posturemate-6b424.appspot.com",
    messagingSenderId: "946978309107",
    appId:             "1:946978309107:android:ef37b5ccf0f12c1d1c95be"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function setStatus(title, infoText, message) {
    document.getElementById('card-title').textContent     = title;
    document.getElementById('spinner').style.display      = 'none';
    document.getElementById('status-message').textContent = message;
    if (infoText) {
      const box = document.getElementById('info-box');
      box.textContent   = infoText;
      box.style.display = 'block';
    }
    document.getElementById('divider').style.display = 'block';
    document.getElementById('actions').style.display = 'flex';
  }

  const params = new URLSearchParams(window.location.search);
  const action = params.get('action');
  const uid    = params.get('uid');

  if (!uid || !action) {
    setStatus(
      'Link non valido',
      'Parametri mancanti nel link ricevuto via email.',
      'Il link utilizzato non contiene le informazioni necessarie. Contattare il supporto.'
    );
  } else if (action === 'approve') {
    db.ref('v2/users/doctors/' + uid + '/approved')
      .set(true)
      .then(() => {
        setStatus(
          'Accesso approvato',
          "Il dottore ha ora accesso completo all'applicazione PostureMate.",
          "L'approvazione e' stata registrata correttamente. Il medico potra' accedere immediatamente."
        );
      })
      .catch(err => {
        setStatus(
          "Errore durante l'approvazione",
          null,
          'Impossibile completare l\'operazione: ' + err.message
        );
      });
  } else if (action === 'reject') {
    setStatus(
      'Accesso rifiutato',
      "Il dottore non potra' accedere all'applicazione finche' non viene approvato manualmente.",
      "La richiesta e' stata rifiutata. Il profilo rimane nel sistema con accesso bloccato."
    );
  } else {
    setStatus(
      'Azione non riconosciuta',
      null,
      'Il parametro "action" nel link non e\' valido. Contattare il supporto.'
    );
  }
</script>

</body>
</html>
