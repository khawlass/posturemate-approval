<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PostureMate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background-color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      background-color: #7CB342;
      padding: 28px 24px;
    }
    .page-header h1 {
      font-size: 24px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.4px;
    }

    .page-body {
      flex: 1;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-title .accent-bar {
      width: 4px;
      min-height: 26px;
      background-color: #7CB342;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .section-title span {
      font-size: 18px;
      font-weight: bold;
      color: #212121;
    }

    .info-box {
      background-color: #f1f8e9;
      border-left: 4px solid #7CB342;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #558b2f;
      line-height: 1.6;
    }

    .status-message {
      font-size: 15px;
      color: #424242;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #7CB342;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 12px 0 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 24px 0 20px;
    }

    .actions {
      display: flex;
      gap: 12px;
    }
    .btn-outline {
      padding: 12px 24px;
      background-color: #ffffff;
      color: #7CB342;
      border: 2px solid #7CB342;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .page-footer {
      background-color: #f4f4f4;
      border-top: 1px solid #e0e0e0;
      padding: 16px 24px;
    }
    .page-footer p {
      font-size: 12px;
      color: #9e9e9e;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <h1>PostureMate</h1>
  </div>

  <div class="page-body">

    <div class="section-title">
      <div class="accent-bar"></div>
      <span id="card-title">Elaborazione in corso</span>
    </div>

    <div class="info-box" id="info-box" style="display:none;"></div>

    <div id="spinner" class="spinner"></div>
    <p class="status-message" id="status-message">Connessione al server in corso...</p>

    <hr class="divider" id="divider" style="display:none;" />

    <div class="actions" id="actions" style="display:none;">
      <a href="mailto:j.khawla@outlook.com" class="btn-outline">Contatta supporto</a>
    </div>

  </div>

  <div class="page-footer">
    <p>PostureMate &middot; Sistema di monitoraggio medico</p>
    <p>Azione eseguita dall'amministratore del sistema.</p>
  </div>

<script>
  function setStatus(title, infoText, message) {
    document.getElementById('card-title').textContent     = title;
    document.getElementById('spinner').style.display      = 'none';
    document.getElementById('status-message').textContent = message;
    if (infoText) {
      var box = document.getElementById('info-box');
      box.textContent   = infoText;
      box.style.display = 'block';
    }
    document.getElementById('divider').style.display = 'block';
    document.getElementById('actions').style.display = 'flex';
  }

  var params = new URLSearchParams(window.location.search);
  var action = params.get('action');
  var uid    = params.get('uid');

  var DB_URL = 'https://posturemate-6b424-default-rtdb.europe-west1.firebasedatabase.app';

  if (!uid || !action) {
    setStatus(
      'Link non valido',
      'Parametri mancanti nel link ricevuto via email.',
      'Il link non contiene le informazioni necessarie. Contattare il supporto.'
    );
  } else if (action === 'approve') {

    var timer = setTimeout(function() {
      setStatus('Timeout', null, 'Il server non ha risposto. Verificare la connessione e riprovare.');
    }, 10000);

    fetch(DB_URL + '/v2/users/doctors/' + encodeURIComponent(uid) + '/approved.json', {
      method:  'PUT',
      headers: { 'Content-Type': 'application/json' },
      body:    'true'
    })
    .then(function(response) {
      clearTimeout(timer);
      if (response.ok) {
        setStatus(
          'Accesso approvato',
          "Il dottore ha ora accesso completo all'applicazione PostureMate.",
          "L'approvazione e' stata registrata. Il medico puo' accedere immediatamente."
        );
      } else {
        return response.text().then(function(text) {
          setStatus('Errore', null, 'Risposta server: ' + text);
        });
      }
    })
    .catch(function(err) {
      clearTimeout(timer);
      setStatus('Errore di connessione', null, 'Connessione fallita: ' + err.message);
    });

  } else if (action === 'reject') {
    setStatus(
      'Accesso rifiutato',
      "Il dottore non potra' accedere all'applicazione finche' non viene approvato manualmente.",
      "La richiesta e' stata rifiutata. Il profilo rimane nel sistema con accesso bloccato."
    );
  } else {
    setStatus(
      'Azione non riconosciuta',
      null,
      'Il parametro nel link non e\' valido. Contattare il supporto.'
    );
  }
</script>

</body>
</html>
